plugins {
	id 'fabric-loom' version '1.7.4'
	id 'java'
}

def mcVersions = [
		"1.20-1.20.4": [
				minecraft : "1.20.1",
				yarn      : "1.20.1+build.10",
				loader    : "0.15.11",
				fabric_api: "0.92.0+1.20.1",
				java      : JavaVersion.VERSION_17
		],
		"1.20.5-1.20.6": [
				minecraft : "1.20.6",
				yarn      : "1.20.6+build.3",
				loader    : "0.15.11",
				fabric_api: "0.100.8+1.20.6",
				java      : JavaVersion.VERSION_21
		],
		"1.21-1.21.x": [
				minecraft : "1.21.1",
				yarn      : "1.21.1+build.3",
				loader    : "0.16.5",
				fabric_api: "0.104.0+1.21.1",
				java      : JavaVersion.VERSION_21
		]
]

def activeVersion = mcVersions["1.21-1.21.x"]

def dashEnv = [:]
def dashEnvFile = file(".env")
if (dashEnvFile.exists()) {
	dashEnvFile.eachLine("UTF-8") { line ->
		def trimmed = line.trim()
		if (!trimmed || trimmed.startsWith("#") || !trimmed.contains("=")) return
		def index = trimmed.indexOf("=")
		def key = trimmed.substring(0, index).trim()
		def value = trimmed.substring(index + 1).trim()
		if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')
				|| value.length() >= 2 && value.startsWith("'") && value.endsWith("'")) {
			value = value.substring(1, value.length() - 1)
		}
		dashEnv[key] = value
	}
}

def dashApiUrl = System.getenv("DASH_API_URL") ?: dashEnv["DASH_API_URL"] ?: "http://localhost:3000/api"

processResources {
	inputs.property("dashApiUrl", dashApiUrl)

	filesMatching("dash.properties") {
		expand(apiUrl: dashApiUrl)
	}
}

group   = "com.dash"
version = "1.0.0+mc${activeVersion.minecraft}"

repositories {
	maven { url "https://maven.fabricmc.net/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${activeVersion.minecraft}"
	mappings  "net.fabricmc:yarn:${activeVersion.yarn}:v2"
	modImplementation "net.fabricmc:fabric-loader:${activeVersion.loader}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${activeVersion.fabric_api}"
	implementation 'com.google.code.gson:gson:2.10.1'
}

java {
	sourceCompatibility = activeVersion.java
	targetCompatibility = activeVersion.java
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = activeVersion.java == JavaVersion.VERSION_21 ? 21 : 17
}

jar {
	from("LICENSE") { rename { "${it}_${project.archivesBaseName}" } }
}
